# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

env:
  # The media commit to build. Update this hash to pick up changes to the
  # dvd branch.
  MEDIA_PKG: codeberg.org/totallygamerjet/media/cmd/dvdplay
  MEDIA_COMMIT: 56f40be6ac93a2d9c42e6f857711654cbb3e230e

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false
      - name: Build WASM
        run: |
          env GOOS=js GOARCH=wasm GOEXPERIMENT=simd go install -trimpath -ldflags="-s -w" "$MEDIA_PKG@$MEDIA_COMMIT"
          cp "$(go env GOPATH)/bin/js_wasm/dvdplay" docs/dvdplay.wasm
          cp "$(go env GOMODCACHE)"/codeberg.org/totallygamerjet/media@*/cmd/dvdplay/web/index.html docs/index.html
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" docs/wasm_exec.js
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: 'docs'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
