<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DVD Player</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📀</text></svg>">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
        width: 100%;
        height: 100%;
        background-color: #000;
        font-family: 'Courier New', monospace;
        overflow: hidden;
    }

    /* Scanlines belong to the front of the machine, not to the film: they lie
       over the chrome, which is opaque and would otherwise hide them, and are
       taken away entirely once a disc is playing so the picture is the
       picture. */
    .scanline {
        position: fixed;
        inset: 0;
        z-index: 200;
        pointer-events: none;
        background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.1) 0px,
                rgba(0, 0, 0, 0.1) 1px,
                transparent 1px,
                transparent 2px
        );
    }

    /* Ebitengine puts its canvas straight in the body as soon as the program
       runs — 0x0 until a disc is playing — and writes its own inline styles
       onto the body, so the chrome floats over the top rather than sharing a
       layout with it. */
    #chrome {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        background: #000;
    }
    body.playing #chrome,
    body.playing .scanline { display: none; }

    .container {
        text-align: center;
        padding: 3rem;
        max-width: 40rem;
        border: 2px solid #00ff00;
        border-radius: 10px;
        background: rgba(0, 20, 0, 0.5);
        animation: pulse 3s ease-in-out infinite;
    }

    @keyframes pulse {
        0%, 100% {
            box-shadow:
                    0 0 20px rgba(0, 255, 0, 0.3),
                    0 0 40px rgba(0, 255, 0, 0.2),
                    0 0 60px rgba(0, 255, 0, 0.1),
                    inset 0 0 20px rgba(0, 255, 0, 0.05);
        }
        50% {
            box-shadow:
                    0 0 30px rgba(0, 255, 0, 0.5),
                    0 0 60px rgba(0, 255, 0, 0.3),
                    0 0 90px rgba(0, 255, 0, 0.2),
                    inset 0 0 30px rgba(0, 255, 0, 0.1);
        }
    }

    .icon {
        font-size: 4rem;
        margin-bottom: 1.5rem;
        color: #00ff00;
        text-shadow: 0 0 20px #00ff00;
    }

    h1 {
        color: #00ff00;
        font-size: 2rem;
        text-transform: uppercase;
        letter-spacing: 4px;
        margin-bottom: 1rem;
        text-shadow: 0 0 10px #00ff00;
    }

    .status {
        color: #00cc00;
        font-size: 0.9rem;
        letter-spacing: 2px;
        opacity: 0.8;
        line-height: 1.6;
    }
    /* The state and whatever the system has to say sit together, the way a
       console prints. The hint is the one line meant for a person, so it comes
       after the button it is about. */
    #error { margin-top: 0.5rem; }
    #hint { margin-top: 1.5rem; }

    .blinking { animation: blink 1.5s step-end infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    /* .button is shared by #pick, a real <button>, and the <label> that
       fronts the plain file input — a label styled this way and pointed at
       a hidden input with "for" is the usual way to get a file picker that
       does not look like the browser's own control. */
    .button {
        display: inline-block;
        padding: 0.8rem 2rem;
        background: transparent;
        border: 2px solid #00ff00;
        border-radius: 5px;
        color: #00ff00;
        font-family: 'Courier New', monospace;
        font-size: 1rem;
        letter-spacing: 2px;
        text-transform: uppercase;
        cursor: pointer;
        transition: all 0.3s ease;
        text-shadow: 0 0 5px #00ff00;
        box-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
    }
    .button:hover:not(:disabled) {
        background: rgba(0, 255, 0, 0.1);
        box-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
        text-shadow: 0 0 10px #00ff00;
    }
    .button:active:not(:disabled) { transform: scale(0.98); }
    .button:disabled, .button.disabled { opacity: 0.4; cursor: default; pointer-events: none; }
    /* The two pickers sit side by side where both are offered, and #pick is
       taken out of the flow entirely — not just hidden — where the browser
       has no directory picker to open. */
    .pickers { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; margin-top: 1.5rem; }
    #pick.unsupported { display: none; }

    /* Amber rather than red: still of the same screen. */
    #error code {
        color: #00ff00;
        background: rgba(0, 255, 0, 0.08);
        padding: 0.1em 0.4em;
        border-radius: 3px;
    }

    #error {
        min-height: 1.6em;
        color: #ffb000;
        font-size: 0.85rem;
        letter-spacing: 1px;
        text-shadow: 0 0 10px rgba(255, 176, 0, 0.6);
    }

    canvas { outline: none; }
</style>

<div class="scanline"></div>

<div id="chrome">
    <div class="container">
        <div class="icon">💿</div>
        <h1>DVD Player</h1>
        <p class="status" id="state">// SYSTEM INITIALIZING <span class="blinking">_</span></p>
        <p class="status" id="error"></p>
        <div class="pickers">
            <button id="pick" class="button" disabled>Starting…</button>
            <label id="pickFileLabel" for="pickFile" class="button disabled">Open ISO / CDR File</label>
            <input type="file" id="pickFile" accept=".iso,.cdr,.img,.nrg" hidden>
        </div>
        <p class="status" id="hint">
            Choose the folder holding the disc's VIDEO_TS directory, or a single
            ISO or cdr image of one.
        </p>
    </div>
</div>

<script src="wasm_exec.js"></script>
<script>
    const button = document.getElementById("pick");
    const fileLabel = document.getElementById("pickFileLabel");
    const error = document.getElementById("error");
    const status = document.getElementById("state");

    // The directory picker is the File System Access API's
    // showDirectoryPicker, Chromium only as of writing. Where it is missing,
    // the button is taken out of the page rather than left there disabled —
    // Go never enables it either, since it goes by the same check — and the
    // file input is the one way in, which every browser this runs in offers.
    const haveDirPicker = !!window.showDirectoryPicker;
    if (!haveDirPicker) {
        button.classList.add("unsupported");
    }

    // dvdplay calls these as it goes: it is the only side that can tell when
    // the pickers are live, or that a disc opened from a folder or file that
    // held none. Each picker is opened by Go from inside its own press or
    // change event, which is what keeps the gesture the browser insists on
    // for the directory picker, and is harmless for the plain file input.
    window.dvdplayReady = () => {
        if (haveDirPicker) {
            button.disabled = false;
            button.textContent = "Open Disc Folder";
        }
        fileLabel.classList.remove("disabled");
        status.innerHTML = '// READY <span class="blinking">_</span>';
    };
    window.dvdplayStarted = (name) => {
        document.body.classList.add("playing");
        document.title = name ? name + " — DVD Player" : "DVD Player";
    };
    window.dvdplayFailed = (message) => {
        showError(message);
        // The file input clears its own selection choosing the same file
        // again would otherwise not raise a change event for.
        document.getElementById("pickFile").value = "";
    };

    // Set the message as text, then mark up anything the viewer is meant to
    // type. Building the HTML from the message itself would put whatever the
    // error happens to say straight into the page.
    function showError(message) {
        error.textContent = "// " + message;
        for (const cmd of ["dvdplay -unlock"]) {
            const at = error.textContent.indexOf(cmd);
            if (at < 0) continue;
            const tail = error.firstChild.splitText(at);
            tail.splitText(cmd.length);
            const code = document.createElement("code");
            code.textContent = cmd;
            tail.replaceWith(code);
        }
    }
    // Playback stopped after it had started: bring the chrome back rather than
    // leave the viewer looking at a black screen.
    window.dvdplayFatal = (message) => {
        document.body.classList.remove("playing");
        status.innerHTML = "// PLAYBACK STOPPED";
        showError(message);
        button.disabled = true;
        fileLabel.classList.add("disabled");
        button.textContent = "Reload To Try Again";
    };

    const go = new Go();
    WebAssembly.instantiateStreaming(fetch("dvdplay.wasm"), go.importObject)
        .then((result) => go.run(result.instance))
        .catch((err) => {
            button.textContent = "Could Not Start";
            error.textContent = "// " + String(err);
        });
</script>
